name: Wrong replacement
description: holdback replaced something that is not private, and the agent needed it.
labels: [wrong replacement]
body:
  - type: markdown
    attributes:
      value: Use made-up values of the same shape. Do not paste real names, emails, keys or file contents.
  - type: input
    id: version
    attributes:
      label: holdback version
      description: The output of `holdback --version`.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Proxy (holdback run or holdback serve)
        - Hook mode
        - Local detector trial (holdback spans)
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: Claude Code 2.x with Sonnet 5.5
  - type: textarea
    id: masked
    attributes:
      label: Output showing the replacement
      description: >-
        For a local trial, paste the `refined` array from your made-up example. For the proxy, paste the
        relevant lines of `holdback review --masked`. For hook mode, you can also use the matching lines of
        `~/.local/state/holdback/sightings.log`.
      render: text
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: What should have stayed
      description: Give a made-up example, the part that should stay visible, and why it matters.
    validations:
      required: true
  - type: checkboxes
    id: private
    attributes:
      label: Before you send
      options:
        - label: This report holds no real private value.
          required: true
