[package]
name = "holdback"
version = "0.2.3"
edition = "2024"
description = "Local proxy that keeps personal data and secrets out of requests to cloud LLMs"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
aws-lc-rs = { version = "1.19", default-features = false }  # SHA-256 of model downloads; already built for TLS
axum = "0.8.9"
bytes = "1"
fancy-regex = "0.20.2"
futures-util = "0.3.34"
memmap2 = "0.9.12"
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["stream"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiktoken-rs = "0.12.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.54.1", features = ["full"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
gemm = "0.19.0"

[profile.release]
opt-level = 3
