b0{opacity:0;animation:kb0 16.0s linear infinite}@keyframes kb1{0%,24.36%{opacity:0}24.38%,97%{opacity:1}100%{opacity:0}}.b1{opacity:0;animation:kb1 16.0s linear infinite}@keyframes kb2{0%,24.36%{opacity:0}24.38%,97%{opacity:1}100%{opacity:0}}.b2{opacity:0;animation:kb2 16.0s linear infinite}@keyframes kb3{0%,24.36%{opacity:0}24.38%,97%{opacity:1}100%{opacity:0}}.b3{opacity:0;animation:kb3 16.0s linear infinite}@keyframes kb4{0%,33.74%{opacity:0}33.75%,97%{opacity:1}100%{opacity:0}}.b4{opacity:0;animation:kb4 16.0s linear infinite}@keyframes kb5{0%,36.87%{opacity:0}36.88%,97%{opacity:1}100%{opacity:0}}.b5{opacity:0;animation:kb5 16.0s linear infinite}@keyframes kb6{0%,36.87%{opacity:0}36.88%,97%{opacity:1}100%{opacity:0}}.b6{opacity:0;animation:kb6 16.0s linear infinite}@keyframes kb7{0%,41.24%{opacity:0}41.25%,97%{opacity:1}100%{opacity:0}}.b7{opacity:0;animation:kb7 16.0s linear infinite}</style>
<rect x="1" y="0" width="898" height="326" rx="9" fill="#0d1117" stroke="#30363d"/>
<circle cx="20" cy="15" r="5.5" fill="#ff5f57"/><circle cx="38" cy="15" r="5.5" fill="#febc2e"/><circle cx="56" cy="15" r="5.5" fill="#28c840"/>
<text x="450.0" y="19.5" text-anchor="middle" class="t">your terminal</text>
<line x1="1" y1="30" x2="899" y2="30" stroke="#30363d"/>
<text x="18" y="52" class="cmd a0" xml:space="preserve">$ cat customers.csv</text>
<text x="18" y="71" class="out a1" xml:space="preserve">name,email,plan</text>
<text x="18" y="90" class="real a2" xml:space="preserve">Maria Gonzalez,maria.gonzalez@gmail.com,pro</text>
<text x="18" y="109" class="real a3" xml:space="preserve">Daniel Okafor,dokafor88@outlook.com,team</text>
<text x="18" y="128" class="cmd a4" xml:space="preserve">$ holdback run claude -p &quot;Read customers.csv and write welcome.txt with one line per</text>
<text x="18" y="147" class="cmd a5" xml:space="preserve">  customer: Hello &lt;name&gt; &lt;&lt;email&gt;&gt;, welcome to the &lt;plan&gt; plan.&quot; \</text>
<text x="18" y="166" class="cmd a6" xml:space="preserve">  --model claude-haiku-5-5 --allowedTools Read,Write,Bash</text>
<text x="18" y="185" class="out a7" xml:space="preserve">I wrote welcome.txt in the work directory with one line per customer from customers.csv,</text>
<text x="18" y="204" class="out a8" xml:space="preserve">which has two customers:</text>
<text x="18" y="223" class="real a9" xml:space="preserve">Hello Maria Gonzalez &lt;maria.gonzalez@gmail.com&gt;, welcome to the pro plan.</text>
<text x="18" y="242" class="real a10" xml:space="preserve">Hello Daniel Okafor &lt;dokafor88@outlook.com&gt;, welcome to the team plan.</text>
<text x="18" y="261" class="cmd a11" xml:space="preserve">$ cat welcome.txt</text>
<text x="18" y="280" class="real a12" xml:space="preserve">Hello Maria Gonzalez &lt;maria.gonzalez@gmail.com&gt;, welcome to the pro plan.</text>
<text x="18" y="299" class="real a13" xml:space="preserve">Hello Daniel Okafor &lt;dokafor88@outlook.com&gt;, welcome to the team plan.</text>
<rect x="1" y="342" width="898" height="212" rx="9" fill="#0d1117" stroke="#30363d"/>
<circle cx="20" cy="357" r="5.5" fill="#ff5f57"/><circle cx="38" cy="357" r="5.5" fill="#febc2e"/><circle cx="56" cy="357" r="5.5" fill="#28c840"/>
<text x="450.0" y="361.5" text-anchor="middle" class="t">what the model provider receives</text>
<line x1="1" y1="372" x2="899" y2="372" stroke="#30363d"/>
<text x="18" y="394" class="dim b0" xml:space="preserve">tool result: Read customers.csv</text>
<text x="18" y="413" class="out b1" xml:space="preserve">name,email,plan</text>
<text x="18" y="432" class="ph b2" xml:space="preserve">[PRIVATE_PERSON_380],[PRIVATE_EMAIL_381],pro</text>
<text x="18" y="451" class="ph b3" xml:space="preserve">[PRIVATE_PERSON_382],[PRIVATE_EMAIL_383],team</text>
<text x="18" y="470" class="dim b4" xml:space="preserve">the model&#x27;s tool call: Write welcome.txt</text>
<text x="18" y="489" class="ph b5" xml:space="preserve">Hello [PRIVATE_PERSON_380] &lt;[PRIVATE_EMAIL_381]&gt;, welcome to the pro plan.</text>
<text x="18" y="508" class="ph b6" xml:space="preserve">Hello [PRIVATE_PERSON_382] &lt;[PRIVATE_EMAIL_383]&gt;, welcome to the team plan.</text>
<text x="18" y="527" class="dim b7" xml:space="preserve">holdback puts the real values back before the file is written</text>
</svg>
